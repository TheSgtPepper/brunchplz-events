name: Refresh events.json
on:
  schedule:
    - cron: "7 * * * *"     # hourly at :07 UTC
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: events, cancel-in-progress: true }
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build feed (public event info only)
        env:
          TICKET_TAILOR_API_KEY: ${{ secrets.TICKET_TAILOR_API_KEY }}
        run: python3 build_events.py events.json
      - name: Commit if changed
        run: |
          git config user.name "events-bot"
          git config user.email "events-bot@users.noreply.github.com"
          git add events.json merch.json
          git diff --cached --quiet || (git commit -m "Refresh events.json" && git push)
